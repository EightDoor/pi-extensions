name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate installation policy
        run: node scripts/check-install-policy.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run affected tests
        env:
          PI_EXTENSIONS_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm test

  macos-install:
    name: Verify native macOS installation
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate installation policy
        run: node scripts/check-install-policy.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify native file watching
        run: npm exec -- vitest run test/macos-install.test.ts
